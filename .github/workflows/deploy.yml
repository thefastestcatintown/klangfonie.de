name: Build and deploy to Netcup

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    # Fallback if a webhook delivery is delayed or unavailable.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: netcup-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
      PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.PUBLIC_CONTACT_FORM_ENDPOINT }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=dev --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @astrojs/check@0.9.12 typescript@6.0.3
          npm ls @astrojs/check typescript

      - name: Test and build
        run: |
          npm test
          npm run build
          npm run check:seo

      - name: Upload site to Netcup
        env:
          NETCUP_FTP_HOST: ${{ secrets.NETCUP_FTP_HOST }}
          NETCUP_FTP_USER: ${{ secrets.NETCUP_FTP_USER }}
          NETCUP_FTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD }}
        run: |
          find dist/_astro -type f -print | sed 's#^dist/##' | sort > dist/deploy-manifest.txt
          remote_manifest=$(curl --silent --fail "$PUBLIC_SITE_URL/deploy-manifest.txt" || true)

          upload_group() {
            local group="$1"
            local -a args
            local upload_count=0
            args=(--parallel --parallel-immediate --parallel-max 2 --silent --show-error --fail --retry 5 --retry-delay 2 --retry-all-errors --ftp-ssl-control --ftp-create-dirs --user "$NETCUP_FTP_USER:$NETCUP_FTP_PASSWORD")
            while IFS= read -r -d '' file; do
              relative_path="${file#dist/}"
              if [[ "$group" == assets && "$relative_path" == _astro/* ]] && grep --fixed-strings --line-regexp --quiet "$relative_path" <<< "$remote_manifest"; then
                continue
              fi
              args+=(--upload-file "$file" "ftp://$NETCUP_FTP_HOST/$relative_path")
              upload_count=$((upload_count + 1))
            done < <(if [[ "$group" == html ]]; then find dist -type f \( -name '*.html' -o -name 'deploy-manifest.txt' \) -print0; else find dist -type f ! -name '*.html' ! -name 'deploy-manifest.txt' -print0; fi)
            if (( upload_count > 0 )); then
              curl "${args[@]}"
            fi
            echo "Uploaded $upload_count $group files."
          }

          # Public, versioned assets first; entry-point HTML last avoids mixed releases.
          upload_group assets
          upload_group html

      - name: Deployment summary
        run: echo 'Klangfonia was built, checked and deployed to https://klangfonia.de.' >> "$GITHUB_STEP_SUMMARY"
